<!DOCTYPE html>
<html>
<head>
  <title>Dark Mode</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style.css">
</head>
<style>
    body {
  background-color: white;
  color: black;
  transition: 0.3s;
}

.dark {
  background-color: black;
  color: white;
}

</style>
<body>

  <button onclick="toggleDark()" class="all">Toggle Dark Mode</button>

  <h1>Hello World</h1>
  <p>This is my website.</p>

  <script >
function toggleDark() {
  document.body.classList.toggle("dark");
}

  </script>
</body>
</html>
